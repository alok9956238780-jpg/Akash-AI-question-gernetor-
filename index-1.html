<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akash AI Question Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#fff;padding:18px}
.card{max-width:650px;margin:auto;background:#1e293b;border-radius:20px;padding:22px;box-shadow:0 10px 30px #0005}
h1{text-align:center;color:#38bdf8;margin-top:0}
p{text-align:center;color:#cbd5e1}
label{display:block;margin-top:14px;margin-bottom:6px;font-weight:bold}
select,input,button{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px}
select,input{background:#334155;color:#fff}
button{margin-top:20px;background:#22c55e;color:#fff;font-weight:bold;cursor:pointer}
#questions{margin-top:20px}
.q{background:#334155;padding:14px;margin:10px 0;border-radius:12px;line-height:1.5}
.small{font-size:13px;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
<h1>🤖 Akash AI Question Generator</h1>
<p>विद्यार्थियों के लिए Practice Questions बनाएं</p>

<label>कक्षा</label>
<select id="class">
<option>10</option><option>9</option><option>8</option><option>7</option>
</select>

<label>विषय</label>
<select id="subject">
<option>विज्ञान</option>
<option>गणित</option>
<option>सामाजिक विज्ञान</option>
<option>हिंदी</option>
<option>अंग्रेजी</option>
</select>

<label>Topic / Chapter</label>
<input id="topic" placeholder="जैसे: प्रकाश, त्रिभुज, लोकतंत्र">

<label>कितने प्रश्न?</label>
<select id="count">
<option value="5">5</option><option value="10">10</option>
<option value="15">15</option><option value="20">20</option>
</select>

<button onclick="generate()">✨ Questions Generate करें</button>
<div id="questions"></div>
</div>

<script>
function generate(){
 const cls=document.getElementById("class").value;
 const sub=document.getElementById("subject").value;
 const topic=document.getElementById("topic").value.trim() || "इस अध्याय";
 const n=Number(document.getElementById("count").value);
 const patterns=[
  `${topic} की परिभाषा अपने शब्दों में लिखिए।`,
  `${topic} के मुख्य बिंदुओं को समझाइए।`,
  `${topic} का एक उदाहरण दीजिए।`,
  `${topic} का दैनिक जीवन में क्या महत्व है?`,
  `${topic} से संबंधित दो कारण लिखिए।`,
  `${topic} के प्रमुख गुण/विशेषताएँ लिखिए।`,
  `${topic} पर एक संक्षिप्त टिप्पणी लिखिए।`,
  `${topic} से जुड़ा एक महत्वपूर्ण प्रश्न हल/समझाइए।`,
  `${topic} में आने वाली सामान्य गलती क्या हो सकती है?`,
  `${topic} को उदाहरण सहित समझाइए।`
 ];
 let out=`<div class="small">कक्षा ${cls} • ${sub} • ${topic}</div>`;
 for(let i=0;i<n;i++){
   out+=`<div class="q"><b>प्रश्न ${i+1}.</b> ${patterns[i%patterns.length]}</div>`;
 }
 document.getElementById("questions").innerHTML=out;
}
</script>
</body>
</html>
